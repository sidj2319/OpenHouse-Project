# Runs the backend plus a local mail catcher (Mailpit) so enquiry emails can be
# inspected at http://localhost:8025 without any paid service or account.
services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SALES_INBOX_EMAIL: ${SALES_INBOX_EMAIL:-sales@example.com}
      FEATURED_PRODUCT_IDS: ${FEATURED_PRODUCT_IDS:-1,5,9,13,15}
    depends_on:
      - mailpit

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
